name: Ingest Lambda

on:
  push:
    branches: [main]
    paths:
      - 'cmd/ingest/**'
      - '.github/workflows/ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

# Note: vet+test for the ingest module runs in ci.yml on every PR (the
# module has its own go.mod, so ci.yml's root `go test ./...` doesn't
# reach it — there's an explicit `cd cmd/ingest && go test` step instead).
# This workflow is deploy-only: build the linux/arm64 zip and replace
# the Lambda's code on every main push touching cmd/ingest/**.
jobs:
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/ingest/go.sum

      - name: Build + package
        run: make zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INGESTION_DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INGESTION_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.INGESTION_DEPLOY_AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name organizze-mcp-stats-ingest \
            --zip-file fileb://function.zip \
            --publish
