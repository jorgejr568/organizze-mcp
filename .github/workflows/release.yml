name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Test
        run: go test -race -count=1 ./...

  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: jorgejr568/organizze-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INGESTION_DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INGESTION_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.INGESTION_DEPLOY_AWS_REGION }}

      # Fetch the ingest token from AWS Secrets Manager at build time.
      # Single source of truth lives in SM (the same secret the ingest
      # Lambda reads at cold start). The deployer IAM user has
      # ReadIngestSharedSecret scoped to this secret only. The secret
      # ID lives in vars.INGESTION_DEPLOY_SECRET_ID so rotating the
      # secret path (or pointing at a staging copy) doesn't require a
      # workflow edit. ::add-mask:: registers the value with the runner
      # so it can't leak into subsequent log output even if downstream
      # actions echo build-args.
      - name: Fetch ingest shared secret
        id: ingest_secret
        env:
          SECRET_ID: ${{ vars.INGESTION_DEPLOY_SECRET_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_ID" ]; then
            echo "::error::vars.INGESTION_DEPLOY_SECRET_ID is not set" >&2
            exit 1
          fi
          SECRET="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString --output text)"
          if [ -z "$SECRET" ]; then
            echo "::error::Secrets Manager returned an empty value for $SECRET_ID" >&2
            exit 1
          fi
          echo "::add-mask::$SECRET"
          echo "value=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            INGEST_URL=${{ vars.INGESTION_DEPLOY_URL }}
            INGEST_TOKEN=${{ steps.ingest_secret.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          BODY="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - " {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)"

          if [ -z "$(printf "%s" "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for v${VERSION}. Add '## [${VERSION}] - YYYY-MM-DD' on main before tagging." >&2
            exit 1
          fi

          PREV="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {sub(/^## \[/, ""); sub(/\].*/, ""); print; exit}
          ' CHANGELOG.md)"

          {
            printf "%s\n" "$BODY"
            printf "## Docker\n\n"
            printf '```\n'
            printf "docker pull jorgejr568/organizze-mcp:%s\n" "$VERSION"
            printf "docker pull jorgejr568/organizze-mcp:%s\n" "${VERSION%.*}"
            printf "docker pull jorgejr568/organizze-mcp:latest\n"
            printf '```\n\n'
            if [ -n "$PREV" ]; then
              printf "**Full changelog:** https://github.com/jorgejr568/organizze-mcp/compare/v%s...v%s\n" "$PREV" "$VERSION"
            else
              printf "**Full changelog:** https://github.com/jorgejr568/organizze-mcp/releases/tag/v%s\n" "$VERSION"
            fi
          } > release_notes.md

          echo "Release notes written to release_notes.md:"
          echo "----"
          cat release_notes.md
          echo "----"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
