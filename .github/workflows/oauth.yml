name: OAuth Binary

on:
  push:
    branches: [main]
    paths:
      - 'cmd/organizze-mcp-oauth/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/oauth.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/organizze-mcp-oauth/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/oauth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build OAuth binary
        run: go build -o /tmp/organizze-mcp-oauth ./cmd/organizze-mcp-oauth

      - name: Test (full module)
        run: go test -race -count=1 ./...

  docker:
    name: Build and push Docker image
    needs: test
    # Skip on pull_request — only build+push on direct main pushes and tag
    # pushes. PRs still run the test job above so the Dockerfile/code change
    # is exercised before merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # On v* tag pushes: emit semver tags (0.9.0 / 0.9 / 0) + :latest.
      # On main pushes (no tag): emit :latest + :sha-<short> for traceable
      # rollbacks during development. metadata-action picks the right set
      # based on the ref shape.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: jorgejr568/organizze-mcp-oauth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/organizze-mcp-oauth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
