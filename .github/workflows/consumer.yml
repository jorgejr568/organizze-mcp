name: Consumer

on:
  push:
    branches: [main]
    paths:
      - 'cmd/consumer/**'
      - '.github/workflows/consumer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/consumer/**'
      - '.github/workflows/consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-${{ github.ref }}
  cancel-in-progress: false

# Note: Docker image build+push for the consumer happens in release.yml on
# `v*` tag pushes alongside the other two images. This workflow only runs
# vet+test on the standalone consumer module — which the root CI cannot
# do because cmd/consumer has its own go.mod.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/consumer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/consumer/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
