name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build (single-tenant)
        run: go build -o /dev/null ./cmd/organizze-mcp

      - name: Build (OAuth multi-tenant)
        run: go build -o /dev/null ./cmd/organizze-mcp-oauth

      # cmd/consumer and cmd/ingest are separate go modules — root-level
      # `go test ./...` does NOT descend into them, so we run them
      # explicitly here. Both are quick (no DB, no network) so paying
      # for them on every PR is cheaper than a separate workflow file.
      - name: Test (consumer module)
        working-directory: cmd/consumer
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -o /dev/null ./...

      - name: Test (ingest module)
        working-directory: cmd/ingest
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -o /dev/null ./...

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
